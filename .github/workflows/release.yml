name: Release

on:
  push:
    branches: [main, master]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Missing KEYSTORE_BASE64 / KEYSTORE_PASSWORD."
            echo "Run ./scripts/setup-fdroid-and-secrets.sh (see DISTRIBUTION.md)."
            exit 1
          fi
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ["KEYSTORE_BASE64"]
          Path("release.jks").write_bytes(base64.b64decode(raw))
          alias = os.environ.get("KEY_ALIAS") or "burton"
          store = os.environ["KEYSTORE_PASSWORD"]
          key = os.environ.get("KEY_PASSWORD") or store
          Path("keystore.properties").write_text(
              "storeFile=release.jks\n"
              f"storePassword={store}\n"
              f"keyAlias={alias}\n"
              f"keyPassword={key}\n"
          )
          PY
          echo "Release signing configured (stable keystore)."

      - name: Compute version metadata
        id: version
        run: |
          MAJOR=1
          BASE_MINOR=0
          MINOR=$(( BASE_MINOR + GITHUB_RUN_NUMBER / 100 ))
          PATCH=$(( GITHUB_RUN_NUMBER % 100 ))
          VERSION_CODE="${GITHUB_RUN_NUMBER}"
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}"
          TAG="v${VERSION_NAME}-build${GITHUB_RUN_NUMBER}"
          echo "build_number=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build GitHub release APK and bundle
        run: >
          ./gradlew :app:assembleGithubRelease :app:bundleGithubRelease --no-daemon
          -PappVersionCode=${{ steps.version.outputs.version_code }}
          -PappVersionName=${{ steps.version.outputs.version_name }}

      - name: Publish stable latest APK alias
        run: |
          VERSIONED="app/build/outputs/apk/github/release/Burton-${{ steps.version.outputs.version_name }}.apk"
          cp "$VERSIONED" app/build/outputs/apk/github/release/Burton-latest.apk

      - name: Prepare release notes
        id: notes
        env:
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          PREV_TAG=$(git tag --list 'v*-build*' --sort=-creatordate | head -1)
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..HEAD"
          else
            RANGE="HEAD~15..HEAD"
          fi
          NOTES=$(
            git log "$RANGE" --pretty=format:'- %s (%h)' --no-merges \
              | grep -Eiv '^- (chore|ci|build|refactor|style|test)(\(|:| )' \
              | head -20 \
              || true
          )
          if [ -z "$NOTES" ]; then
            NOTES="- Bug fixes and improvements"
          fi
          {
            echo "notes<<EOF"
            echo "## Burton ${VERSION_NAME} (build ${BUILD_NUMBER})"
            echo
            echo "**Version code:** ${VERSION_CODE}"
            echo "**Commit:** [\`${GITHUB_SHA::7}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA})"
            echo
            echo "### What's new"
            echo "$NOTES"
            echo
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Burton ${{ steps.version.outputs.version_name }} (build ${{ steps.version.outputs.build_number }})
          body: ${{ steps.notes.outputs.notes }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          files: |
            app/build/outputs/apk/github/release/Burton-${{ steps.version.outputs.version_name }}.apk
            app/build/outputs/apk/github/release/Burton-latest.apk
            app/build/outputs/bundle/githubRelease/app-github-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# Publish a tagged FOSS APK for F-Droid reproducible builds (Binaries / AllowedAPKSigningKeys).
name: F-Droid Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a GitHub Release for this build (uncheck to just build + upload artifacts)
        required: false
        type: boolean
        default: true

concurrency:
  group: fdroid-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read F-Droid version
        id: version
        run: |
          VERSION_NAME="$(tr -d '[:space:]' < version.txt)"
          VERSION_CODE=$(python3 -c 'v=open("version.txt").read().strip().split("-",1)[0]; m,n,p=v.split(".")[:3]; p="".join(c for c in p if c.isdigit()) or "0"; print(int(m)*1000000+int(n)*1000+int(p))')
          TAG="v${VERSION_NAME}-fdroid"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "F-Droid ${VERSION_NAME} (code ${VERSION_CODE}, tag ${TAG})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create local.properties
        run: echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Missing KEYSTORE_BASE64 / KEYSTORE_PASSWORD."
            exit 1
          fi
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = os.environ["KEYSTORE_BASE64"]
          Path("release.jks").write_bytes(base64.b64decode(raw))
          alias = os.environ.get("KEY_ALIAS") or "burton"
          store = os.environ["KEYSTORE_PASSWORD"]
          key = os.environ.get("KEY_PASSWORD") or store
          Path("keystore.properties").write_text(
              "storeFile=release.jks\n"
              f"storePassword={store}\n"
              f"keyAlias={alias}\n"
              f"keyPassword={key}\n"
          )
          PY

      - name: Build F-Droid release APK
        run: ./gradlew :app:assembleFdroidRelease --no-daemon

      - name: Upload built APK (unpublished test build)
        if: ${{ inputs.publish == false }}
        uses: actions/upload-artifact@v4
        with:
          name: apk-fdroid-${{ steps.version.outputs.version_code }}
          path: app/build/outputs/apk/fdroid/release/Burton-${{ steps.version.outputs.version_name }}.apk
          retention-days: 14

      - name: Create GitHub Release
        if: ${{ inputs.publish != false }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Burton ${{ steps.version.outputs.version_name }} (F-Droid)
          body: |
            FOSS build for F-Droid reproducible builds.

            - **versionName:** ${{ steps.version.outputs.version_name }}
            - **versionCode:** ${{ steps.version.outputs.version_code }}
            - **tag:** `${{ steps.version.outputs.tag }}`
            - Signed with the Burton release key (`AllowedAPKSigningKeys`).

            Not for sideload / website downloads — use a `v*-buildN` GitHub Release for those.
          draft: false
          prerelease: true
          make_latest: false
          files: |
            app/build/outputs/apk/fdroid/release/Burton-${{ steps.version.outputs.version_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
